name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --console=plain --no-daemon -Dorg.gradle.jvmargs=-Xmx5g

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Dolphy-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Dolphy-debug-apk
          path: Dolphy-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dolphy APK (build ${{ github.run_number }})
          files: Dolphy-debug.apk
